# Kivenseuranta (Netti_01_02) Docker Composella (myos Unraidin Compose Manager -lisaosa).
#
#   docker compose build          # rakentaa kuvan tasta kansiosta (kerran; uudelleen, kun ohjelma paivittyy)
#   docker compose up -d          # kaynnistaa
#   docker compose logs -f        # loki (sama nakyy selaimessa: http://PALVELIN:63884)
#   docker compose down           # pysayttaa (tallenne ja CSV viimeistellaan ensin)
#
# Oletus: videokansion valvonta. Pudota videotiedosto kansioon /mnt/user/kivenseuranta/video -> kontti analysoi sen ja kirjoittaa tulokset kansioon /mnt/user/kivenseuranta/ulos.
# YouTube-linkit: kirjoita ne tiedostoon /mnt/user/kivenseuranta/youtube.txt (yksi per rivi): kontin ei tarvitse kaynnistya uudelleen.
# Kanavan uudet lahetykset (Streams) analysoidaan itsestaan: kirjoita kanavan osoite (https://www.youtube.com/@KANAVA/streams) samaan tiedostoon tai kayta NETTI_KANAVAT alla.
# YouTube-lahetyksen tai -videon analyysiin ks. NETTI_LAHDE alla; kaikki asetukset: README_unraid.md.
services:
  netti:
    build: .
    image: kivenseuranta:latest
    container_name: kivenseuranta
    restart: unless-stopped          # kertaajossa (yksi video tai YouTube-VOD, ei valvontaa) kayta: restart: "no"
    stop_grace_period: 90s           # SIGTERMin jalkeen tallenteen ja CSV:n viimeistely saa kestaa
    ports:
      - "63884:63884"                # selainnakyma (kuva, loki, tiedostot): vasen = palvelimen portti (vaihda tama, jos se on varattu), oikea = kontin portti (= NETTI_WEB_PORTTI). Ala avaa internetiin.
    volumes:
      - /mnt/user/kivenseuranta:/data        # video/ (syote), ulos/ (tulokset), kalibroinnit/ (omat kalibroinnit)
    environment:
      TZ: Europe/Helsinki
      PUID: "99"                     # Unraid: nobody
      PGID: "100"                    # Unraid: users
      UMASK: "022"
      # --- LAHDE (jata pois = kansion /data/video valvonta + linkkilista /data/youtube.txt) ---
      # NETTI_LAHDE: "hnTTLqHr5x8"                         # YouTube-tunnus tai -osoite (video tai live)
      # NETTI_LAHDE: "https://www.youtube.com/@KANAVA/live" # kanavan live-lahetys; yhdessa NETTI_JATKUVA=1:n kanssa odottaa lahetysta
      # NETTI_LAHDE: "/data/video/peli.mp4"                # yksittainen tiedosto
      # NETTI_JATKUVA: "1"                                 # valvonta: ajo paattyy -> odota ja yrita uudelleen (kansio: uudet videot)
      # --- KANAVAT: kanavan jokainen UUSI lahetys (Streams) analysoidaan itsestaan, kun se on paattynyt (kanavalla jo olevia videoita ei ajeta) ---
      # NETTI_KANAVAT: "@KANAVA"                           # tai osoite https://www.youtube.com/@KANAVA/streams; useita pilkulla erotettuna (kanavia voi lisata myos tiedostoon youtube.txt)
      # NETTI_KANAVA_VALI_MIN: "5"                         # kuinka usein kanavan luettelo haetaan (min)
      # NETTI_KANAVA_VANHAT: "1"                           # kokeiluun: kanavalla jo olevista videoista nain monta uusinta ajetaan ensimmaisella kerralla (oletus 0)
      # NETTI_KANAVA_MIN_KESTO_MIN: "20"                   # tata lyhyemmat videot (min) jatetaan pois; 0 = ei rajaa
      # NETTI_KANAVA_SUODATIN: "matarmaa|finaali"          # vain videot, joiden nimessa on tama (saannollinen lauseke)
      # NETTI_KANAVA_LIVE: "1"                             # kanavan suora lahetys analysoidaan heti (oletus: vasta kun se on paattynyt)
      # --- yleisimmat asetukset ---
      NETTI_VIDEO: "1"                 # tallenna kuvallinen video (mp4); 0 = vain CSV (saastaa levytilaa)
      NETTI_VIIVE: "10"                # kuvan viive analyysiin nahden (s)
      # NETTI_KANSIO: ""               # kalibrointikansio (nimi tai polku); tyhja = valitaan videon mukaan automaattisesti
      # NETTI_WEB_PORTTI: "63884"      # kontin portti (muuta vain host-verkossa); 0 = ei selainnakymaa
      # NETTI_WEB_KAYTTAJA: "kayttaja" # salasana selainnakymaan (kumpikin pakollinen)
      # NETTI_WEB_SALASANA: "salasana"
      # YTDLP_PAIVITA: "1"             # paivita yt-dlp kontin kaynnistyessa (YouTube muuttuu usein)
      # YTDLP_KEKSIT: "/data/cookies.txt"  # YouTube vaatii kirjautumisen (bot-tarkistus): selaimesta viety cookies.txt
      # NETTI_LISAVALITSIMET: "--kiri 0 --lataus 15"       # mika tahansa netti_live.py:n valitsin (python netti_live.py --help)
    # Resurssirajat (valinnainen). Ohjelma lukee rajat ja mitoittaa tyoprosessit ja puskurit niiden mukaan.
    # cpus: 4
    # mem_limit: 8g
    # cpuset: "2-5"                    # kiinnita tietyille ytimille
    # Intel / Nvidia -kuvakoodaus (ei testattu): NETTI_KOODEKKI: "auto" ja laitteen jako, ks. README_unraid.md
